<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community | GharDaari</title>
  <link rel="stylesheet" href="style.css?v=15">
</head>
<body data-page="community">
  <header class="site-header">
    <nav class="navbar">
      <a class="brand" href="home.html"><span>GD</span>GharDaari</a>
      <button class="nav-toggle" type="button" aria-label="Open navigation" aria-expanded="false"><span></span><span></span><span></span></button>
      <div class="nav-links">
        <a href="home.html">Home</a>
        <a href="categories.html">Categories</a>
        <a href="community.html" class="active">Community</a>
        <a href="resources.html">Resources</a>
        <a href="profile.html">Profile</a>
        <button type="button" data-logout>Logout</button>
      </div>
    </nav>
  </header>

  <main class="chat-layout">
    <aside class="card chat-sidebar">
      <div class="chat-top">
        <h1>Community</h1>
        <button class="btn btn-primary" type="button" data-open-group>New Group</button>
      </div>
      <input type="search" id="chatSearch" placeholder="Search groups or contacts...">
      <h2>Groups</h2>
      <div class="chat-list" id="groupList"></div>
      <h2>Direct Messages</h2>
      <div class="chat-list" id="dmList"></div>
    </aside>

    <section class="card chat-window">
      <div class="chat-header">
        <div>
          <p class="eyebrow" data-chat-type>Group</p>
          <h1 data-chat-title>Kitchen Helpers</h1>
        </div>
        <span class="pill">Database chat</span>
      </div>
      <div class="messages" id="messageList"></div>
      <form class="message-form" id="messageForm">
        <input type="text" id="messageText" placeholder="Type a message...">
        <button class="btn btn-primary" type="submit">Send</button>
      </form>
    </section>
  </main>

  <div class="modal" id="groupModal" aria-hidden="true">
    <div class="modal-card">
      <button type="button" class="modal-close" data-close-modal aria-label="Close">x</button>
      <h2>Create Group</h2>
      <form id="groupForm" novalidate>
        <div class="form-group">
          <label for="groupName">Group name</label>
          <input type="text" id="groupName" placeholder="Example: Sewing Help">
        </div>
        <div class="form-group">
          <label for="groupAbout">About</label>
          <textarea id="groupAbout" rows="3" placeholder="What is this group for?"></textarea>
        </div>
        <p class="form-message" id="groupMessage" aria-live="polite"></p>
        <button class="btn btn-primary full-width" type="submit">Create Group</button>
      </form>
    </div>
  </div>

  <script src="config.js?v=1"></script>
  <script src="script.js?v=21"></script>
</body>
</html>
