<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup | GharDaari</title>
  <link rel="stylesheet" href="style.css?v=15">
</head>
<body data-page="signup">
  <header class="site-header">
    <nav class="navbar">
      <a class="brand" href="index.html"><span>GD</span>GharDaari</a>
      <button class="nav-toggle" type="button" aria-label="Open navigation" aria-expanded="false"><span></span><span></span><span></span></button>
      <div class="nav-links">
        <a href="login.html">Login</a>
        <a href="signup.html" class="active">Signup</a>
      </div>
    </nav>
  </header>

  <main class="auth-page">
    <section class="auth-card auth-card-wide">
      <div class="auth-heading">
        <div class="form-logo">GD</div>
        <h1>Create Account</h1>
        <p>Create your GharDaari account and save it in the database.</p>
      </div>
      <form id="signupForm" novalidate>
        <div class="form-grid">
          <div class="form-group">
            <label for="fullName">Full name</label>
            <input type="text" id="fullName" placeholder="Your full name">
          </div>
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Choose username">
          </div>
          <div class="form-group">
            <label for="signupEmail">Email</label>
            <input type="email" id="signupEmail" placeholder="you@example.com">
          </div>
          <div class="form-group">
            <label for="signupPassword">Password</label>
            <input type="password" id="signupPassword" placeholder="At least 8 characters with a number">
          </div>
          <div class="form-group">
            <label for="confirmPassword">Confirm password</label>
            <input type="password" id="confirmPassword" placeholder="Confirm password">
          </div>
          <div class="form-group">
            <label for="motherName">Mother's name</label>
            <input type="text" id="motherName" placeholder="Used for password reset">
          </div>
          <div class="form-group">
            <label for="birthMonth">Birthday month</label>
            <input type="text" id="birthMonth" placeholder="Example: January">
          </div>
        </div>
        <p class="form-message" id="signupMessage" aria-live="polite"></p>
        <button class="btn btn-primary full-width" type="submit">Signup</button>
      </form>
      <p class="switch-text">Already have an account? <a href="login.html">Login</a></p>
    </section>
  </main>

  <script src="config.js?v=2"></script>
  <script src="script.js?v=20"></script>
</body>
</html>
