<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | GharDaari</title>
  <link rel="stylesheet" href="style.css?v=15">
</head>
<body data-page="login">
  <header class="site-header">
    <nav class="navbar">
      <a class="brand" href="index.html"><span>GD</span>GharDaari</a>
      <button class="nav-toggle" type="button" aria-label="Open navigation" aria-expanded="false"><span></span><span></span><span></span></button>
      <div class="nav-links">
        <a href="login.html" class="active">Login</a>
        <a href="signup.html">Signup</a>
      </div>
    </nav>
  </header>

  <main class="auth-page">
    <section class="auth-card">
      <div class="auth-heading">
        <div class="form-logo">GD</div>
        <h1>Welcome Back</h1>
        <p>Login with the account you created in the GharDaari database.</p>
      </div>
      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" placeholder="Enter password">
        </div>
        <p class="form-message" id="loginMessage" aria-live="polite"></p>
        <button class="btn btn-primary full-width" type="submit">Login</button>
      </form>
      <p class="switch-text"><a href="forgot-password.html">Forgot password?</a></p>
      <p class="switch-text">New to GharDaari? <a href="signup.html">Create an account</a></p>
    </section>
  </main>

  <script src="config.js?v=2"></script>
  <script src="script.js?v=21"></script>
</body>
</html>
