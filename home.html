<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home | GharDaari</title>
  <link rel="stylesheet" href="style.css?v=15">
</head>
<body data-page="home">
  <header class="site-header">
    <nav class="navbar">
      <a class="brand" href="home.html"><span>GD</span>GharDaari</a>
      <button class="nav-toggle" type="button" aria-label="Open navigation" aria-expanded="false"><span></span><span></span><span></span></button>
      <div class="nav-links">
        <a href="home.html" class="active">Home</a>
        <a href="categories.html">Categories</a>
        <a href="community.html">Community</a>
        <a href="resources.html">Resources</a>
        <a href="profile.html">Profile</a>
        <button type="button" data-logout>Logout</button>
      </div>
    </nav>
  </header>

  <main class="feed-layout">
    <aside class="left-panel">
      <section class="card profile-mini" data-home-profile></section>
      <section class="card menu-card">
        <a href="home.html">Home Feed</a>
        <a href="categories.html">Explore Categories</a>
        <a href="community.html">Groups and DMs</a>
        <a href="resources.html">Resources</a>
      </section>
    </aside>

    <section class="main-feed">
      <div class="page-heading compact">
        <p class="eyebrow">GharDaari Home</p>
        <h1>Community Feed</h1>
        <p>Share thoughts, ask questions, upload pictures, and save useful posts.</p>
        <button class="btn btn-primary" type="button" id="openPostComposer">Add Post</button>
      </div>

      <form class="card composer" id="postForm" novalidate hidden>
        <div class="composer-row">
          <span class="avatar" data-user-avatar>GD</span>
          <textarea id="postText" rows="3" placeholder="Write a thought, question, or experience..."></textarea>
        </div>
        <div class="preview-wrap" id="imagePreviewWrap" hidden>
          <img id="imagePreview" alt="Selected post preview">
          <button class="btn btn-outline" type="button" id="removeImage">Remove image</button>
        </div>
        <div class="composer-actions">
          <label class="btn btn-outline" for="postImage">Upload Image</label>
          <input type="file" id="postImage" accept="image/*">
          <select id="postCategory" aria-label="Post category"></select>
          <button class="btn btn-primary" type="submit">Publish</button>
        </div>
        <p class="form-message" id="postMessage" aria-live="polite"></p>
      </form>

      <section class="feed-list" id="feedList"></section>
    </section>

  </main>

  <div class="modal" id="commentModal" aria-hidden="true">
    <div class="modal-card">
      <button type="button" class="modal-close" data-close-modal aria-label="Close">x</button>
      <h2>Comments</h2>
      <div id="commentList" class="comment-list"></div>
      <form id="commentForm">
        <div class="form-group">
          <label for="commentText">Add comment</label>
          <input type="text" id="commentText" placeholder="Write a comment...">
        </div>
        <button class="btn btn-primary full-width" type="submit">Comment</button>
      </form>
    </div>
  </div>

  <script src="config.js?v=1"></script>
  <script src="script.js?v=21"></script>
</body>
</html>
