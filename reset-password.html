<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | GharDaari</title>
  <link rel="stylesheet" href="style.css?v=15">
</head>
<body data-page="reset-password">
  <header class="site-header">
    <nav class="navbar">
      <a class="brand" href="index.html"><span>GD</span>GharDaari</a>
      <button class="nav-toggle" type="button" aria-label="Open navigation" aria-expanded="false"><span></span><span></span><span></span></button>
      <div class="nav-links">
        <a href="login.html">Login</a>
        <a href="signup.html">Signup</a>
      </div>
    </nav>
  </header>

  <main class="auth-page">
    <section class="auth-card">
      <div class="auth-heading">
        <div class="form-logo">GD</div>
        <h1>New Password</h1>
        <p>Use the reset token and choose a stronger new password.</p>
      </div>
      <form id="resetPasswordForm" novalidate>
        <div class="form-group">
          <label for="resetToken">Reset token</label>
          <input type="text" id="resetToken" placeholder="Paste reset token">
        </div>
        <div class="form-group">
          <label for="resetPassword">New password</label>
          <input type="password" id="resetPassword" placeholder="At least 8 characters with a number">
        </div>
        <div class="form-group">
          <label for="resetConfirmPassword">Confirm new password</label>
          <input type="password" id="resetConfirmPassword">
        </div>
        <p class="form-message" id="resetMessage" aria-live="polite"></p>
        <button class="btn btn-primary full-width" type="submit">Reset Password</button>
      </form>
    </section>
  </main>

  <script src="config.js?v=1"></script>
  <script src="script.js?v=21"></script>
</body>
</html>
