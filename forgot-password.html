<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | GharDaari</title>
  <link rel="stylesheet" href="style.css?v=15">
</head>
<body data-page="forgot-password">
  <header class="site-header">
    <nav class="navbar">
      <a class="brand" href="index.html"><span>GD</span>GharDaari</a>
      <button class="nav-toggle" type="button" aria-label="Open navigation" aria-expanded="false"><span></span><span></span><span></span></button>
      <div class="nav-links">
        <a href="login.html">Login</a>
        <a href="signup.html">Signup</a>
      </div>
    </nav>
  </header>

  <main class="auth-page">
    <section class="auth-card">
      <div class="auth-heading">
        <div class="form-logo">GD</div>
        <h1>Reset Password</h1>
        <p>Answer your security questions to create a password reset token.</p>
      </div>
      <form id="forgotPasswordForm" novalidate>
        <div class="form-group">
          <label for="forgotEmail">Email</label>
          <input type="email" id="forgotEmail" placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label for="forgotMotherName">Mother's name</label>
          <input type="text" id="forgotMotherName" placeholder="Answer from signup">
        </div>
        <div class="form-group">
          <label for="forgotBirthMonth">Birthday month</label>
          <input type="text" id="forgotBirthMonth" placeholder="Example: January">
        </div>
        <p class="form-message" id="forgotMessage" aria-live="polite"></p>
        <button class="btn btn-primary full-width" type="submit">Continue To Reset</button>
      </form>
      <p class="switch-text"><a href="login.html">Back to login</a></p>
    </section>
  </main>

  <script src="config.js?v=1"></script>
  <script src="script.js?v=21"></script>
</body>
</html>
